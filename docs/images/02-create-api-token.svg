<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Create and copy an API token</title><desc id="desc">Enter a token name and expiry, press plus Token, then copy the token from the new row before refreshing.</desc>
<rect width="1100" height="650" fill="#F1F5F9"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace}</style>
<text x="34" y="48" font-size="28" fill="#172033" font-weight="700">2 / Create a token and copy it once</text>
<text x="34" y="80" font-size="18" fill="#6D28D9" font-weight="400">PURPLE · Enter / Create     AMBER · Copy once</text>
<rect x="34" y="111" width="1032" height="374" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="59" y="151" font-size="24" fill="#172033" font-weight="700">API Token</text>
<circle cx="73" cy="190" r="17" fill="#6D28D9"/>
<text x="68" y="196" font-size="17" fill="#FFFFFF" font-weight="700">1</text>
<text x="100" y="197" font-size="18" fill="#6D28D9" font-weight="700">Token name</text>
<rect x="59" y="212" width="455" height="53" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
<text x="76" y="245" font-size="19" fill="#172033" font-weight="400">My first API example</text>
<circle cx="548" cy="190" r="17" fill="#6D28D9"/>
<text x="543" y="196" font-size="17" fill="#FFFFFF" font-weight="700">2</text>
<text x="574" y="197" font-size="18" fill="#6D28D9" font-weight="700">Expires on</text>
<rect x="534" y="212" width="277" height="53" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
<text x="551" y="245" font-size="18" fill="#172033" font-weight="400">Choose a future date</text>
<circle cx="851" cy="190" r="17" fill="#6D28D9"/>
<text x="846" y="196" font-size="17" fill="#FFFFFF" font-weight="700">3</text>
<text x="876" y="197" font-size="18" fill="#6D28D9" font-weight="700">Create</text>
<rect x="839" y="212" width="197" height="53" rx="12" fill="#6D28D9" stroke="#6D28D9" stroke-width="2"/>
<text x="885" y="245" font-size="20" fill="#FFFFFF" font-weight="700">+ Token</text>
<text x="60" y="310" font-size="18" fill="#92400E" font-weight="700">New token row — copy before refreshing this page</text>
<rect x="59" y="330" width="977" height="126" rx="12" fill="#FFFBEB" stroke="#92400E" stroke-width="2"/>
<text x="76" y="359" font-size="14" fill="#526079" font-weight="700">NAME</text>
<text x="333" y="359" font-size="14" fill="#526079" font-weight="700">API TOKEN</text>
<text x="719" y="359" font-size="14" fill="#526079" font-weight="700">EXPIRED ON</text>
<text x="914" y="359" font-size="14" fill="#526079" font-weight="700">ACTION</text>
<text x="76" y="409" font-size="17" fill="#172033" font-weight="400">My first API example</text>
<text x="333" y="409" font-size="19" fill="#92400E" font-weight="700">YOUR_FULL_TOKEN</text>
<text x="719" y="409" font-size="17" fill="#172033" font-weight="400">Your date</text>
<rect x="906" y="378" width="57" height="52" rx="12" fill="#FEF3C7" stroke="#92400E" stroke-width="2"/>
<rect x="921" y="389" width="21" height="24" rx="3" fill="#FFFFFF" stroke="#92400E" stroke-width="2"/>
<rect x="927" y="395" width="21" height="24" rx="3" fill="#FFFFFF" stroke="#92400E" stroke-width="2"/>
<circle cx="985" cy="404" r="17" fill="#92400E"/>
<text x="980" y="410" font-size="17" fill="#FFFFFF" font-weight="700">4</text>
<text x="55" y="524" font-size="19" fill="#172033" font-weight="400">1. Give it a name.    2. Set its expiry.    3. Click + Token.    4. Click the copy icon.</text>
<rect x="34" y="548" width="1032" height="65" rx="12" fill="#FFFBEB" stroke="#92400E" stroke-width="2"/>
<text x="55" y="576" font-size="20" fill="#92400E" font-weight="700">Save the full token now. After Refresh or navigation, it is hidden.</text>
<text x="55" y="600" font-size="16" fill="#92400E" font-weight="400">If you lose it, create a replacement. “Hidden after creation” is not a usable token.</text>
<text x="34" y="640" font-size="14" fill="#526079" font-weight="400">UI illustration · YOUR_FULL_TOKEN is a placeholder, not an actual credential</text>
</svg>
