<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Find your Simhost API token</title><desc id="desc">Three illustrated UI panels: top-right account menu, Settings with API Key selected, and the API Token destination page.</desc>
